Plot:
  - name: "TruthEnergyVsEta"
    samples: [{name: "TruthEnergyVsEta"}]
    type: "simple_th2"
    z_range: [0,700]
    y_label: "E_{clus,truth} (MeV)"

  - name: "EMEnergyVsEta"
    samples: [{name: "EMEnergyVsEta"}]
    type: "simple_th2"
    z_range: [0,700]
    y_label: "E_{clus,EM} (MeV)"

  - name: "LCWEnergyVsEta"
    samples: [{name: "LCWEnergyVsEta"}]
    type: "simple_th2"
    z_range: [0,700]
    y_label: "E_{clus,LCW} (MeV)"

  - name: "TrueVsCalibrated"
    samples:
      - name: "TrueVsCalibrated"
    type: "simple_th2"
  - name: "TrueVsUncalibrated"
    samples:
      - name: "TrueVsUncalibrated"
    type: "simple_th2"
  - name: "TruthEnergy"
    samples: [{name: "TruthEnergy", linecolor: 1}]
    type: "simple_th1"

  - name: "CalibratedEnergy"
    samples: [{name: "CalibratedEnergy", linecolor: 1}]
    type: "simple_th1"

  - name: "UncalibratedEnergy"
    samples: [{name: "UncalibratedEnergy", linecolor: 1}]
    type: "simple_th1"

  - name: "ClusterEta"
    samples: [{name: "ClusterEta", linecolor: 1}]
    type: "simple_th1"
    x_label: "#eta^{clus}"

  - name: "uTFromPFOsAndCluster"
    samples: [{name: "uTFromClusters", linecolor: 1},{name: "uTFromPFOs", linecolor: 2}]
    type: "overlay"
  - name: "CellSignificance"
    samples:
      - name: "CellSignificance"
        linecolor: 1
    type: "simple_th1"
  - name: "energy_in_eta_regions_0.0_0.5"
    samples: [{name: "TruthEnergyInEta_0.0_0.5", linecolor: 1}, {name: "EMEnergyInEta_0.0_0.5", linecolor: 2}, {name: "LCWEnergyInEta_0.0_0.5", linecolor: 3}]
    type: "simple_th1"
    x_label: "E (MeV)(|#eta|:0-0.5)"
    y_label: "A.U"
    #setlogy: true
    #setlogx: true

