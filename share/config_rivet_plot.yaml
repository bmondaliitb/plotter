      - name: "uT_excluded_mag4"
        linecolor: 4
        <<: *CommonStyles
    type: "overlay"
    y_label: "A.U" 
    x_label: "u_{T}(#eta>4.8)"
    x_range: [0, 200]
  - name: "h_recoil_vs_ptll1"
    samples:
      - name: "h_recoil_vs_ptll1"
        <<: *CommonStyles
    type: "simple_th2"
    x_label: "u_{T}"
    y_label: "p_{T}(ll)"
