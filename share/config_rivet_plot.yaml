        <<: *CommonStyles
      - name: "uT_eta2"
        linecolor: 2
        <<: *CommonStyles
      - name: "uT_eta3"
        linecolor: 3
        <<: *CommonStyles
      - name: "uT_eta4"
        linecolor: 4
        <<: *CommonStyles
    type: "overlay"
    y_label: "A.U" 
    x_label: "#eta(u_{T})"
    x_range: [-5, 5]
  - name: "bias"
