    type: "overlay"  # different typs of plots: overlay, simple_th2, stack ...
    y_label: "A.U"  # y-axis label
    x_label: "u_{T}"
    x_range: [0, 100]  # x-axis range
  - name: "sumEt_in_different_ptV"
