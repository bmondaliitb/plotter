Plot:
  - name: "u_perp_comp"  # this is the name of the plot
    samples:
      - name: "u_perp_setup1"
        linecolor: 1
        <<: *CommonStyles
      - name: "u_perp_setup1.5"
        linecolor: 2
        <<: *CommonStyles
      - name: "u_perp_setup2"
        linecolor: 3
        <<: *CommonStyles
      - name: "u_perp_setup3"
        linecolor: 4
        <<: *CommonStyles
      - name: "u_perp_setup4"
        linecolor: 5
        <<: *CommonStyles
    type: "overlay"  # different typs of plots: overlay, simple_th2, stack ...
    y_label: "A.U"  # y-axis label
    x_label: "u_{perp}"
    x_range: [-20, 20]  # x-axis range
  - name: "u_T"
    samples:
      #- name: "ut_full_phase_space"
      #  linecolor: 1
      #  <<: *CommonStyles
      - name: "uT1"
        linecolor: 2
        <<: *CommonStyles
      - name: "uT1.5"
        linecolor: 3
        <<: *CommonStyles
      - name: "uT2"
        linecolor: 4
        <<: *CommonStyles
      #- name: "uT3"
      #  linecolor: 5
      #  <<: *CommonStyles
      #- name: "uT4"
      #  linecolor: 6
      #  <<: *CommonStyles
    type: "overlay"  # different typs of plots: overlay, simple_th2, stack ...
    y_label: "A.U"  # y-axis label
    x_label: "u_{T}"
    x_range: [0, 100]  # x-axis range
  - name: "u_T_central_only"
    samples:
      - name: "uT2"
        linecolor: 1
        <<: *CommonStyles
      - name: "uT3"
        linecolor: 2
