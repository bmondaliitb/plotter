      - name: "sumEt_ptV_0_5_setup3"
        linecolor: 1
        <<: *CommonStyles
      - name: "sumEt_ptV_5_10_setup3"
        linecolor: 2
        <<: *CommonStyles
      - name: "sumEt_ptV_15_20_setup3"
        linecolor: 3
        <<: *CommonStyles
      - name: "sumEt_ptV_50_60_setup3"
        linecolor: 4
        <<: *CommonStyles
    type: "overlay"  # different typs of plots: overlay, simple_th2, stack ...
    y_label: "A.U"  # y-axis label
    x_label: "#Sigma E_{T}"
    x_range: [0, 500]  # x-axis range
