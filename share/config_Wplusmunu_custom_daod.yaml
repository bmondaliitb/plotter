# Every block in the Plot block holds a plot
Plot:
  - name: "uT"  # this is the name of the plot
    samples:
      - name: "uT_cut3"
        linecolor: 1
        <<: *CommonStyles
    type: "overlay"  # different typs of plots: overlay, simple_th2, stack ...
    y_label: "Events"  # y-axis label
    x_range: [0, 150]  # x-axis range

  - name: "nmu"
    samples:
      - name: "nmu_cut3"
        linecolor: 1
        <<: *CommonStyles
    type: "overlay"
    y_label: "Events"
    x_range: [0, 5]

  - name: "muEta"
